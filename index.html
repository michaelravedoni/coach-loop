<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>CoachLoop</title>
  <!-- Métadonnées PWA & Apple Web App -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CoachLoop">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-grid" id="mainGrid">
    <!-- Les 3 écrans sont créés depuis le gabarit ci-dessous -->

    <!-- 4e quadrant : console de régie -->
    <div class="console-panel" id="consolePanel">
      <div class="console-section">
        <div class="console-header">
          <div class="app-branding">
            <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green);"></span>
            <span class="app-title">Régie terrain</span>
          </div>
          <div class="telemetry-row">
            <div class="pill-telemetry"><span id="fpsVal">— fps</span></div>
            <button class="btn-lock" id="lockBtn" aria-label="Verrouiller les réglages">
              <span id="lockIcon">🔓</span> <span id="lockText">Athlètes</span>
            </button>
          </div>
        </div>

        <button id="mainToggleBtn" class="btn-record-main">Démarrer la session</button>
        <select id="cameraSelect" class="camera-select" aria-label="Caméra" hidden></select>

        <div class="protected-section">
          <div class="section-label">Vitesse globale & repères</div>
          <div class="segmented-control">
            <button class="seg-item active" data-rate="1">1.0x</button>
            <button class="seg-item" data-rate="0.5">0.5x</button>
            <button class="seg-item" data-rate="0.25">0.25x</button>
            <button class="seg-item" id="gridBtn" aria-pressed="false">Grille</button>
          </div>

          <div class="section-label">Zoom</div>
          <div class="segmented-control" style="grid-template-columns: 1fr;">
            <button class="seg-item" id="linkZoomBtn" aria-pressed="false">Zoom lié sur les 3 écrans : non</button>
          </div>

          <div class="section-label">Décalages temporels (secondes)</div>
          <div class="steppers-grid" id="steppers"></div>
        </div>
      </div>

      <div class="console-section">
        <div class="live-monitor-box">
          <span class="live-tag">CAMÉRA DIRECT</span>
          <video id="liveCam" playsinline muted autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>

        <div style="display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px;">
          <span>Session : <strong id="timeReadout" style="color: #fff;">0s</strong></span>
          <span>Tampon : <strong id="bufferReadout" style="color: #fff;">0 s · 0 Mo</strong></span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <template id="screenTemplate">
    <div class="screen-card">
      <div class="video-viewport">
        <div class="video-stack">
          <video playsinline muted></video>
          <video playsinline muted></video>
        </div>
      </div>
      <div class="grid-overlay"></div>
      <div class="wait-overlay"><span>Disponible dans</span><strong data-ref="waitValue">—</strong></div>
      <div class="center-scrub-indicator" data-ref="scrubBadge">-0.0s</div>

      <div class="hud-layer" data-ref="hud">
        <div class="hud-top">
          <div class="top-pill">
            <span data-ref="number"></span>
            <span data-ref="delayLabel"></span>
            <span class="badge-status" data-ref="badge">DIRECT</span>
          </div>
          <div class="hud-top-right">
            <button class="zoom-badge" data-ref="zoomBadge" aria-label="Revenir au zoom 1x" hidden>1.0×</button>
            <button class="btn-icon" data-act="fullscreen" aria-label="Plein écran">⛶</button>
          </div>
        </div>

        <div class="hud-bottom" data-ref="hudBottom">
          <div class="scrubber-track">
            <input type="range" class="scrubber" data-ref="scrub" min="0" max="1" step="0.05" value="0" aria-label="Position dans l'enregistrement">
          </div>
          <div class="actions-row">
            <div class="btn-group">
              <button class="hud-btn btn-play" data-act="play" data-ref="playBtn" aria-label="Lecture / pause">▶</button>
              <button class="hud-btn" data-act="step-back" aria-label="Image précédente">|◀</button>
              <button class="hud-btn" data-act="step-fwd" aria-label="Image suivante">▶|</button>
              <button class="hud-btn" data-act="jump-back" aria-label="Reculer de 3 secondes">−3s</button>
              <button class="hud-btn" data-act="jump-fwd" aria-label="Avancer de 3 secondes">+3s</button>
              <button class="hud-btn btn-speed-badge" data-act="speed" data-ref="speedBtn" aria-label="Vitesse de lecture">1.0x</button>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="hud-time-tag" data-ref="tag">-0.0s</span>
              <div class="btn-direct-wrapper" data-ref="liveWrap">
                <svg class="countdown-svg" viewBox="0 0 16 16" aria-hidden="true">
                  <circle class="countdown-circle-bg" cx="8" cy="8" r="7"/>
                  <circle class="countdown-circle-val" data-ref="ring" cx="8" cy="8" r="7"/>
                </svg>
                <button class="btn-direct" data-act="live">Direct</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
